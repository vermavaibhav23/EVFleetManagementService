services:
  - type: web
    name: ev-charger-guide
    runtime: docker
    plan: free
    branch: codex/charger-guide
    rootDir: charger-guide
    healthCheckPath: /fleet
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_USERNAME
        sync: false
      - key: KAFKA_PASSWORD
        sync: false
      - key: KAFKA_SSL_CA_PEM
        sync: false
      - key: DATABASE_SSL_CA_PEM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite

