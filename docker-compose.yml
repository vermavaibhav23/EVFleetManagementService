services:
  api:
    build: .
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: ev_fleet
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mongodb_data:
